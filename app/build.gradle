plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    // Required for the @Serializable annotations in karinlink/protocol.
    // The dependency (kotlinx-serialization-json) was already present, but the
    // compiler plugin was not, so those annotations would not have generated
    // serializers.
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.karin.streamtv'
    compileSdk 36
    ndkVersion '28.2.13676358'

    signingConfigs {
        release {
            storeFile file("karintv.keystore")
            storePassword findProperty("KARIN_STORE_PASSWORD") ?: "karintv2026"
            keyAlias findProperty("KARIN_KEY_ALIAS") ?: "karintv"
            keyPassword findProperty("KARIN_KEY_PASSWORD") ?: "karintv2026"
        }
    }

    defaultConfig {
        applicationId "com.karintv.player"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            // No suffix - same package for both builds
            signingConfig signingConfigs.release
        }
    }

    // La feature SixtyFpsInterp (interpolador 60 fps reales) YA compila contra
    // media3 1.9.3: MotionX2Mode.REAL60 la usa como "60 fps reales (GRID)"
    // experimental, solo ofrecida en gama alta.

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // KARIN Link protocol tests are plain JVM: they hit android.util.Log
        // (not mocked) and must not need Robolectric. Return defaults instead of
        // throwing, so pure-logic code can be tested without an emulator.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += 'META-INF/versions/9/**'
            excludes += 'META-INF/*.SF'
            excludes += 'META-INF/*.DSA'
            excludes += 'META-INF/*.RSA'
        }
    }
}

// SixtyFpsInterp ya compila contra media3 1.9.3 (MotionX2Mode.REAL60).

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.leanback:leanback-preference:1.0.0'
    implementation 'androidx.tvprovider:tvprovider:1.0.0'

    // DLNA/Cast: descubrimiento de receptores y envío de vídeo.
    // MediaRouter aporta la lista de rutas; el framework de Cast, la sesión.
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'


    // HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // jcifs-ng (SMB client for network file sharing) - used by the file explorer
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'

    // HTML Parser (replaces fragile regex extraction)
    implementation 'org.jsoup:jsoup:1.17.2'

    // Rhino JS Engine (extract video URLs without WebView)
    implementation 'org.mozilla:rhino:1.7.14'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // MoonGetter - Video extraction library for all servers
    implementation 'io.github.darkryh.moongetter:moongetter-core:2.0.0-alpha01'
    implementation 'io.github.darkryh.moongetter:moongetter-server-bundle:2.0.0-alpha01'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Sentry crash reporting
    // implementation 'io.sentry:sentry-android:7.14.0'

    // ExoPlayer (Media3) for native video playback
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    implementation 'androidx.media3:media3-ui-leanback:1.11.0'
    implementation 'androidx.media3:media3-effect:1.11.0'
    implementation 'androidx.media3:media3-common:1.11.0'
    implementation 'androidx.media3:media3-datasource-cronet:1.11.0'
    implementation 'androidx.media3:media3-datasource:1.11.0'
    implementation 'androidx.media3:media3-database:1.11.0'
    // KARIN Link: remux/transcode tier when the TV cannot decode a stream.
    // Also pulls in media3-exoplayer + media3-common at the same version.
    implementation 'androidx.media3:media3-transformer:1.11.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
    // Real HTTP/WebSocket server for KARIN Link transport tests, replacing the
    // placeholder assertTrue(true) suite.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
