name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_VERSION: '8.9.1'

jobs:
  # ── Android Build & Tests ───────────────────────
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Verify Kotlin compilation
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── Security Scan ───────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check for hardcoded secrets in Kotlin sources
        run: |
          grep -rniE "(api[_-]?key|client[_-]?secret|password|token)\s*=\s*\"[A-Za-z0-9/+_.-]{12,}\"" \
            --include="*.kt" --include="*.java" app/src/ \
            | grep -viE "placeholder|example|your[_-]|xxx|todo|test|dummy|\\\$\{" \
            || echo "No hardcoded secrets found."

      - name: Verify no cleartext traffic to private ranges is silently allowed
        run: |
          grep -n 'cleartextTrafficPermitted' app/src/main/res/xml/network_security_config.xml || true

  # ── Deploy (conditional) ────────────────────────
  deploy:
    name: Deploy
    needs: [android, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify success
        run: echo "✅ All checks passed. Ready for deployment."
